name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the comparison engine
        run: git clone --depth=1 https://github.com/authdiff-labs/auth-tree-core.git ../auth-tree-core
      - run: npm test
